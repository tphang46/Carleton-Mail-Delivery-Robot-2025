<!DOCTYPE html>
<html>
<head>
    <title>Robot Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #121212; color: #ffffff; }
        h1, h2, h3 { margin-bottom: 15px; }
        button { margin: 5px; padding: 6px 12px; border-radius: 4px; border: 1px solid #888; background-color: #1f1f1f; color: #fff; cursor: pointer; }
        button:hover { background-color: #333; }
        #average-cards, #latest-cards, #day-cards, #lidar-cards { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .card { border: 1px solid #444; border-radius: 8px; padding: 12px; width: 280px; background-color: #1f1f1f; line-height: 1.4; }
        .good { color: #00e676; font-weight: bold; }
        .bad { color: #ff5252; font-weight: bold; }
        #graphs, #lidar-graphs { display: flex; flex-direction: column; gap: 20px; }
        .graph { width: 100%; height: 300px; }
        a { color: #ffffff; text-decoration: underline; }
        .page { display: none; }
        hr { border: 0; border-top: 1px solid #444; margin: 8px 0; }
        .metric-row { display: flex; justify-content: space-between; font-size: 0.82em; border-bottom: 1px solid #2a2a2a; padding: 2px 0; }
        .na { color: #666; font-style: italic; }
        .comparison-sub { font-size: 0.75em; color: #888; display: block; margin-top: 4px; }
    </style>
</head>
<body>

<h1>Robot Dashboard</h1>

<button id="home-btn">Home</button>
<button id="graphs-btn">Graphs</button>
<button id="lidar-btn">Lidar Data</button>
<button id="back-btn" style="display:none;">Back</button>

<div id="home-page" class="page">
    <h3>Average Performance Metrics</h3>
    <div id="average-cards"></div>

    <h3>Latest Iteration Comparison</h3>
    <div id="latest-info" style="font-weight: bold; margin-bottom: 5px;"></div>
    <div id="latest-cards"></div>

    <h3>Runs Grouped By Day</h3>
    <div id="run-list"></div>
</div>

<div id="graphs-page" class="page">
    <h2>Performance Trends</h2>
    <div id="graphs"></div>
</div>

<div id="lidar-page" class="page">
    <h2>Lidar Sensor Data</h2>
    <h3>Averages</h3>
    <div id="lidar-cards"></div>
    <h3>Sensor Trends</h3>
    <div id="lidar-graphs"></div>
</div>

<div id="day-page" class="page">
    <h2 id="day-title">Day Runs</h2>
    <div id="day-cards"></div>
    <h3>Commits & PRs</h3>
    <div id="day-commits-prs"></div>
</div>

<script>
const OWNER = "tphang46";
const REPO = "Carleton-Mail-Delivery-Robot-2025";
const BRANCH = "robotDashboard";
const LOG_DIR = "tools/logs/runs";
const IGNORE_KEYS = ["voltage_level", "temperature_level", "battery_start", "battery_end"];
const metricRules = { "delivery_time": "lower", "battery_used": "lower" };
let allRunsData = [], metricsKeys = [], lidarKeys = [], allFoundKeys = [];
const colors = ['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf'];

async function fetchRunFiles() {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${LOG_DIR}?ref=${BRANCH}`);
    const files = await res.json();
    return Array.isArray(files) ? files.filter(f => f.name.endsWith(".txt")) : [];
}

async function fetchRunFileContent(url) { return (await fetch(url)).text(); }

function parseRunText(text) {
    const d={};
    text.split("\n").forEach(l => {
        if(l.includes("=")){
            const [k,v] = l.split("=");
            const key = k.trim();
            const val = v.trim();
            if(val === "" || isNaN(val) || (val.includes("-") && val.includes(":"))) {
                d[key] = val;
            } else {
                d[key] = parseFloat(val);
            }
        }
    });
    return d;
}

function updateGlobalKeys(runs) {
    const mKeys = new Set();
    const lKeys = new Set();
    const fKeys = new Set();
    const blacklist = ["run", "date", ...IGNORE_KEYS];
    runs.forEach(r => {
        Object.keys(r).forEach(k => {
            if (blacklist.includes(k)) return;
            fKeys.add(k);
            if (typeof r[k] === "number") {
                if (k.toLowerCase().includes("lidar") || k.toLowerCase().includes("wall")) {
                    lKeys.add(k);
                } else {
                    mKeys.add(k);
                }
            }
        });
    });
    metricsKeys = Array.from(mKeys).sort();
    lidarKeys = Array.from(lKeys).sort();
    allFoundKeys = Array.from(fKeys).sort();
}

function displayCards(runs, keys, containerId){
    const d = document.getElementById(containerId);
    d.innerHTML = "";
    keys.forEach(k => {
        const vals = runs.map(r => r[k]).filter(v => typeof v === "number");
        if (vals.length > 0) {
            const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
            d.innerHTML += `<div class="card"><strong>${k}</strong><br>${avg.toFixed(2)}</div>`;
        }
    });
}

function displayLatestComparison(allRuns, keys) {
    const info = document.getElementById("latest-info");
    const container = document.getElementById("latest-cards");
    if (allRuns.length === 0) return;
    const sorted = [...allRuns].sort((a, b) => b.run.localeCompare(a.run));
    const latest = sorted[0];
    info.textContent = `Latest Run: ${latest.run}`;
    container.innerHTML = "";
    keys.forEach(k => {
        const val = latest[k];
        if (typeof val !== "number") return;
        const allVals = allRuns.map(r => r[k]).filter(v => typeof v === "number");
        const avg = allVals.reduce((a, b) => a + b, 0) / allVals.length;
        const rule = metricRules[k] || "higher";
        let statusClass = "";
        if (val !== avg) {
            if (rule === "lower") statusClass = val < avg ? "good" : "bad";
            else statusClass = val > avg ? "good" : "bad";
        }
        container.innerHTML += `
            <div class="card">
                <strong>${k}</strong><br>
                <span class="${statusClass}">${val.toFixed(2)}</span>
                <span class="comparison-sub">Avg: ${avg.toFixed(2)}</span>
            </div>`;
    });
}

function displayDayRuns(runs, day, commits, prs){
    document.getElementById("day-title").textContent = `Runs for ${day}`;
    const cards = document.getElementById("day-cards");
    cards.innerHTML = "";
    runs.forEach(run => {
        const c = document.createElement("div");
        c.className = "card";
        let html = `<strong>${run.run}</strong><hr>`;
        allFoundKeys.forEach(k => {
            const val = run[k];
            let displayVal = (typeof val === 'number') ? val.toFixed(2) : (val || `<span class="na">N/A</span>`);
            html += `<div class="metric-row"><strong>${k}:</strong> <span>${displayVal}</span></div>`;
        });
        c.innerHTML = html;
        cards.appendChild(c);
    });
    const container = document.getElementById("day-commits-prs");
    container.innerHTML = `<h4>Commits:</h4>${Array.isArray(commits) && commits.length > 0 ? commits.map(c=>`<a target="_blank" href="https://github.com/${OWNER}/${REPO}/commit/${c.sha}">${c.commit.message}</a>`).join("<br>") : "None"}`;
}

function drawPlots(keys, containerId) {
    const g = document.getElementById(containerId); g.innerHTML = "";
    const sorted = [...allRunsData].sort((a,b) => new Date(a.trip_start_time?.replace(" ","T")) - new Date(b.trip_start_time?.replace(" ","T")));
    keys.forEach((m, i) => {
        const div = document.createElement("div"); div.className = "graph"; g.appendChild(div);
        Plotly.newPlot(div, [{
            x: sorted.map(r => r.trip_start_time),
            y: sorted.map(r => r[m]),
            type: 'scatter', mode: 'lines+markers', line: {color: colors[i % colors.length]}
        }], {
            title: m, paper_bgcolor: '#121212', plot_bgcolor: '#121212', font: {color: '#fff'}, margin: {t:40, b:40}
        });
    });
}

async function init() {
    const files = await fetchRunFiles();
    const filePromises = files.map(async (f) => {
        const t = await fetchRunFileContent(f.download_url);
        const m = parseRunText(t);
        m.run = f.name;
        const dateMatch = f.name.match(/\d{4}-\d{2}-\d{2}/);
        m.date = dateMatch ? dateMatch[0] : "unknown";
        return m;
    });
    allRunsData = await Promise.all(filePromises);
    updateGlobalKeys(allRunsData);
    const byDate = {};
    allRunsData.forEach(r => { byDate[r.date] = byDate[r.date] || []; byDate[r.date].push(r); });
    const list = document.getElementById("run-list");
    list.innerHTML = "";
    Object.keys(byDate).sort().reverse().forEach(d => {
        const b = document.createElement("button");
        b.textContent = `${d} (${byDate[d].length} runs)`;
        b.onclick = async () => {
            const commitRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits?since=${d}T00:00:00Z&until=${d}T23:59:59Z`).then(r=>r.json());
            const prRes = await fetch(`https://api.github.com/search/issues?q=repo:${OWNER}/${REPO}+type:pr+merged:${d}`).then(r=>r.json());
            showPage("day-page");
            displayDayRuns(byDate[d], d, Array.isArray(commitRes)?commitRes:[], prRes.items || []);
        };
        list.appendChild(b);
    });
    document.getElementById("home-btn").onclick = () => showPage("home-page");
    document.getElementById("graphs-btn").onclick = () => { showPage("graphs-page"); drawPlots(metricsKeys, "graphs"); };
    document.getElementById("lidar-btn").onclick = () => { showPage("lidar-page"); displayCards(allRunsData, lidarKeys, "lidar-cards"); drawPlots(lidarKeys, "lidar-graphs"); };
    document.getElementById("back-btn").onclick = () => showPage("home-page");
    showPage("home-page");
    displayCards(allRunsData, metricsKeys, "average-cards");
    displayLatestComparison(allRunsData, metricsKeys);
}

function showPage(id) {
    document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    document.getElementById(id).style.display = "block";
    document.getElementById("back-btn").style.display = id === "home-page" ? "none" : "inline";
}

init();
</script>
</body>
</html>
