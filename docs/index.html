<!DOCTYPE html>
<html>
<head>
    <title>Robot Run Reports</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #run-list button { margin: 5px 0; padding: 5px 10px; cursor: pointer; }
        #battery_plot { margin-top: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Robot Run Reports</h1>

    <h3>Available Runs by Day</h3>
    <div id="run-list"></div>

    <h2>Run Details & Commits/PRs</h2>
    <pre id="run-details"></pre>

    <h2>Battery Graph</h2>
    <div id="battery_plot" style="width:100%; max-width:800px; height:400px;"></div>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
