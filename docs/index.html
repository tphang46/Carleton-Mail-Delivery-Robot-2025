<!DOCTYPE html>
<html>
<head>
    <title>Robot Run Reports</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        .card {
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            margin: 5px;
            width: 200px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        #run-details { margin-top: 20px; }
        .graph { width: 800px; height: 400px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Robot Run Reports</h1>

    <h3>Available Runs</h3>
    <div id="run-list"></div>

    <div id="run-details" style="display:none;">
        <h2>Run Metrics</h2>
        <div id="cards"></div>
    </div>

    <h2>Graphs (All Runs)</h2>
    <div id="graphs"></div>

    <script src="script.js"></script>
</body>
</html>
