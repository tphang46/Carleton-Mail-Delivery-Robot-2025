<!DOCTYPE html>
<html>
<head>
    <title>Robot Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #121212;
            color: #ffffff;
        }

        h1, h2, h3 {
            margin-bottom: 15px;
            color: #ffffff;
        }

        #run-list {
            margin-bottom: 30px;
        }

        button.run-btn {
            margin: 5px;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #888;
            background-color: #1f1f1f;
            color: #ffffff;
            cursor: pointer;
        }

        button.run-btn:hover {
            background-color: #333;
        }

        #cards {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .card {
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            width: 150px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.7);
            background-color: #1f1f1f;
            color: #ffffff;
        }

        #graphs {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .graph {
            width: 100%;
            height: 300px;
        }
    </style>
</head>
<body>
    <h1>Robot Dashboard</h1>

    <h3>Available Runs</h3>
    <div id="run-list"></div>

    <div id="run-details" style="display:none;">
        <h3>Run Metrics</h3>
        <div id="cards"></div>
    </div>

    <h2>Graphs (All Runs)</h2>
    <div id="graphs"></div>

    <script>
        const apiUrl = "https://api.github.com/repos/tphang46/Carleton-Mail-Delivery-Robot-2025/contents/src/tools/logs/runs";

        let allRunsData = [];
        let metricsKeys = [];

        const colors = [
            '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728',
            '#9467bd', '#8c564b', '#e377c2', '#7f7f7f',
            '#bcbd22', '#17becf'
        ];

        async function fetchRunFiles() {
            const response = await fetch(apiUrl);
            const files = await response.json();

            const runListDiv = document.getElementById("run-list");
            runListDiv.innerHTML = "";

            const runPromises = files
                .filter(file => file.name.endsWith(".txt"))
                .map(async file => {
                    const text = await fetch(file.download_url).then(res => res.text());
                    const metrics = parseRunText(text);
                    metrics.run = file.name;
                    allRunsData.push(metrics);

                    const btn = document.createElement("button");
                    btn.textContent = file.name;
                    btn.className = "run-btn";
                    btn.onclick = () => displayCards(metrics);
                    runListDiv.appendChild(btn);
                });

            await Promise.all(runPromises);

            if (allRunsData.length > 0) {
                // Exclude unwanted metrics from graphs
                metricsKeys = Object.keys(allRunsData[0])
                    .filter(k => k !== "run" && k !== "trip_start_time" && k !== "trip_end_time" && k !== "battery_start" && k !== "battery_end");
                displayGraphs();
            } else {
                console.warn("No run data loaded!");
            }
        }

        function parseRunText(text) {
            const lines = text.split("\n");
            const data = {};
            lines.forEach(line => {
                if (line.includes("=")) {
                    const [key, value] = line.split("=");
                    const trimmedKey = key.trim();
                    const trimmedValue = value.trim();

                    if (!isNaN(trimmedValue) && trimmedValue !== "") {
                        data[trimmedKey] = parseFloat(trimmedValue);
                    } else {
                        data[trimmedKey] = trimmedValue;
                    }
                }
            });
            return data;
        }

        function displayCards(metrics) {
            const cardsDiv = document.getElementById("cards");
            cardsDiv.innerHTML = "";

            for (let key in metrics) {
                if (key === "run") continue;
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `<strong>${key}</strong>: ${metrics[key]}`;
                cardsDiv.appendChild(card);
            }

            document.getElementById("run-details").style.display = "block";
        }

        function displayGraphs() {
            const graphsDiv = document.getElementById("graphs");
            graphsDiv.innerHTML = "";

            metricsKeys.forEach((metric, index) => {
                const div = document.createElement("div");
                div.className = "graph";
                graphsDiv.appendChild(div);

                const xData = allRunsData.map(d => {
                    const dt = new Date(d.trip_start_time);
                    const year = dt.getFullYear();
                    const month = String(dt.getMonth() + 1).padStart(2, '0');
                    const day = String(dt.getDate()).padStart(2, '0');
                    const hour = String(dt.getHours()).padStart(2, '0');
                    const min = String(dt.getMinutes()).padStart(2, '0');
                    return `${year}-${month}-${day} ${hour}:${min}`;
                });

                const trace = {
                    x: xData,
                    y: allRunsData.map(d => d[metric]),
                    type: 'scatter',
                    mode: 'lines+markers',
                    name: metric,
                    line: { color: colors[index % colors.length], width: 3 },
                    marker: { size: 6 },
                    text: allRunsData.map(d => `${metric}: ${d[metric]}<br>Time: ${d.trip_start_time}`),
                    hoverinfo: 'x+text'
                };

                const layout = {
                    paper_bgcolor: '#121212',
                    plot_bgcolor: '#121212',
                    font: { color: '#ffffff' },
                    title: { text: metric, x: 0.5, xanchor: 'center' },
                    xaxis: {
                        title: 'Trip Start Time',
                        tickangle: -45,
                        automargin: true,
                        gridcolor: '#ffffff33',
                        zerolinecolor: '#ffffff',
                        linecolor: '#ffffff',
                        tickcolor: '#ffffff'
                    },
                    yaxis: {
                        title: metric,
                        automargin: true,
                        gridcolor: '#ffffff33',
                        zerolinecolor: '#ffffff',
                        linecolor: '#ffffff',
                        tickcolor: '#ffffff'
                    },
                    margin: { t: 70, l: 80, r: 40, b: 80 },
                    autosize: true
                };

                Plotly.newPlot(div, [trace], layout, { responsive: true });
            });
        }
        fetchRunFiles();
    </script>
</body>
</html>
