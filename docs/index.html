<!DOCTYPE html>
<html>
<head>
    <title>Robot Run Reports</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1, h2, h3 { margin-bottom: 15px; }
        #run-list { margin-bottom: 30px; }
        button.run-btn {
            margin: 5px;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #888;
            background-color: #f0f0f0;
            cursor: pointer;
        }
        button.run-btn:hover { background-color: #ddd; }

        #cards { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            width: 150px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        #graphs { display: flex; flex-wrap: wrap; gap: 20px; }
        .graph { flex: 1 1 calc(50% - 20px); height: 300px; }
    </style>
</head>
<body>
    <h1>Robot Run Reports</h1>

    <h3>Available Runs</h3>
    <div id="run-list"></div>

    <div id="run-details" style="display:none;">
        <h3>Run Metrics</h3>
        <div id="cards"></div>
    </div>

    <h2>Graphs (All Runs)</h2>
    <div id="graphs"></div>

    <script src="script.js"></script>
</body>
</html>
