<!DOCTYPE html>
<html>
<head>
    <title>Robot Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #121212; color: #ffffff; }
        h1, h2, h3 { margin-bottom: 15px; }
        button, select { margin: 5px; padding: 6px 12px; border-radius: 4px; border: 1px solid #888; background-color: #1f1f1f; color: #fff; cursor: pointer; }
        button:hover, select:hover { background-color: #333; }
        #cards, #average-cards, #latest-cards, #day-cards { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .card { border: 1px solid #444; border-radius: 8px; padding: 10px; width: 170px; background-color: #1f1f1f; }
        .good { color: #00e676; }
        .bad { color: #ff5252; }
        .legend { margin-top: 10px; }
        .legend span { margin-right: 20px; }
        #graphs { display: flex; flex-direction: column; gap: 20px; }
        .graph { width: 100%; height: 300px; }
        a { color: #ffffff; text-decoration: underline; }
        a:hover { color: #bbbbbb; }
        .page { display: none; }
    </style>
</head>
<body>

<h1 id="dashboard-title">Robot Dashboard</h1>

<p>
<strong>Repository:</strong> ConnorYelle/Carleton-Mail-Delivery-Robot<br>
<strong>Branch:</strong> <span id="branch-name"></span><br>
<strong>Latest Commit:</strong> <span id="latest-commit"></span><br>
<strong>Latest PR:</strong> <span id="latest-pr"></span>
</p>

<label for="branch-select">Select Branch:</label>
<select id="branch-select"></select>
<button id="load-branch">Load Branch</button>

<div id="home-page" class="page">
    <h3>Average of Each Metric</h3>
    <div id="average-cards"></div>

    <h3>Latest Iteration Information</h3>
    <div class="legend">
        <span class="good">Green: Metric Improved With Update</span>
        <span class="bad">Red: Metric Got Worse With Update</span>
    </div>
    <div id="latest-info"></div>
    <div id="latest-cards"></div>

    <h3>Data On Our Runs Grouped By Day</h3>
    <div id="run-list"></div>
</div>

<div id="graphs-page" class="page">
    <h2>Graphs</h2>
    <div id="graphs"></div>
</div>

<div id="day-page" class="page">
    <h2 id="day-title">Day Runs</h2>
    <div id="day-cards"></div>
    <h3>Commits & PRs</h3>
    <div id="day-commits-prs"></div>
</div>

<script>
const OWNER = "tphang46";
const REPO = "Carleton-Mail-Delivery-Robot-2025";
const COMMITS_OWNER = "ConnorYelle";
const COMMITS_REPO = "Carleton-Mail-Delivery-Robot";
const EXEMPT_KEYS = ["temperature_level", "voltage_level"];
const metricRules = { "delivery_time": "lower", "battery_used": "lower" };
let BRANCH;
let allRunsData = [], metricsKeys = [], dayRunsData = [];
const colors = ['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd'];

function getBranchFromURL() {
    const p = new URLSearchParams(window.location.search);
    return p.get("branch");
}

async function fetchBranches() {
    const res = await fetch(`https://api.github.com/repos/${COMMITS_OWNER}/${COMMITS_REPO}/branches`);
    return await res.json();
}

async function fetchLatestCommit(branch) {
    const c = await (await fetch(`https://api.github.com/repos/${COMMITS_OWNER}/${COMMITS_REPO}/commits?sha=${branch}&per_page=1`)).json();
    return c[0];
}

async function fetchLatestPR(branch) {
    const r = await (await fetch(`https://api.github.com/search/issues?q=repo:${COMMITS_OWNER}/${COMMITS_REPO}+type:pr+is:merged+base:${branch}&sort=updated&order=desc`)).json();
    return r.items?.[0];
}

async function fetchRunFiles() {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/src/tools/logs/runs?ref=${BRANCH}`);
    const files = await res.json();
    return files.filter(f => f.name.endsWith(".txt"));
}

async function fetchRunFileContent(url) { return (await fetch(url)).text(); }

function parseRunText(text) {
    const d = {};
    text.split("\n").forEach(l => { if(l.includes("=")){ const [k,v]=l.split("="); d[k.trim()]=isNaN(v)?v.trim():parseFloat(v); }});
    return d;
}

function extractRunDate(filename) { return filename.split("_")[1]; }

function calculateAverages(runs, keys) {
    const avg = {};
    keys.forEach(k=>{ let s=0,c=0; runs.forEach(r=>typeof r[k]==="number"&&(s+=r[k],c++)); if(c) avg[k]=s/c; });
    return avg;
}

function getMetricClass(metric,value,avgValue){
    if(EXEMPT_KEYS.includes(metric)) return "";
    const r=metricRules[metric]||"higher";
    if(r==="higher") return value>avgValue?"good":value<avgValue?"bad":"";
    if(r==="lower") return value<avgValue?"good":value>avgValue?"bad":"";
    return "";
}

async function buildRunList() {
    const urlBranch = getBranchFromURL();
    const branches = await fetchBranches();
    const select = document.getElementById("branch-select");
    select.innerHTML = "";
    branches.forEach(b=>{
        const opt=document.createElement("option");
        opt.value=b.name; opt.textContent=b.name; select.appendChild(opt);
    });
    BRANCH = urlBranch || branches[0].name;
    select.value = BRANCH;

    const latestCommit = await fetchLatestCommit(BRANCH);
    const latestPR = await fetchLatestPR(BRANCH);

    document.getElementById("branch-name").textContent = BRANCH;
    document.getElementById("latest-commit").innerHTML = `<a target="_blank" href="${latestCommit.html_url}">${latestCommit.commit.message}</a>`;
    document.getElementById("latest-pr").innerHTML = latestPR ? `<a target="_blank" href="https://github.com/${COMMITS_OWNER}/${COMMITS_REPO}/pull/${latestPR.number}">#${latestPR.number} ${latestPR.title}</a>` : "None";

    const files = await fetchRunFiles();
    const byDate = {};
    files.forEach(f=>{ const d=extractRunDate(f.name); byDate[d]??=[]; byDate[d].push(f); });
    const list = document.getElementById("run-list"); list.innerHTML="";
    Object.keys(byDate).forEach(d=>{
        const b=document.createElement("button"); b.textContent=`${d} (${byDate[d].length} runs)`;
        b.onclick=async()=>{
            dayRunsData=[]; for(const f of byDate[d]){ const t=await fetchRunFileContent(f.download_url); const m=parseRunText(t); m.run=f.name; dayRunsData.push(m);}
            metricsKeys=Object.keys(dayRunsData[0]).filter(k=>!["run","trip_start_time","trip_end_time","battery_start","battery_end"].includes(k));
            document.getElementById("home-page").style.display="none";
            document.getElementById("graphs-page").style.display="none";
            document.getElementById("day-page").style.display="block";
            document.getElementById("back-btn").style.display="inline";
            const cards=document.getElementById("day-cards"); cards.innerHTML="";
            dayRunsData.forEach(run=>{
                const c=document.createElement("div"); c.className="card"; let html=`<strong>${run.run}</strong><br>`; Object.keys(run).forEach(k=>{if(!["run","trip_start_time","trip_end_time","battery_start","battery_end"].includes(k)) html+=`${k}: ${run[k]}<br>`;}); c.innerHTML=html; cards.appendChild(c);
            });
        };
        list.appendChild(b);
    });
}

document.getElementById("load-branch").onclick = ()=>{
    const branch = document.getElementById("branch-select").value;
    window.location.search = `?branch=${branch}`;
};

buildRunList();
</script>
</body>
</html>
